name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1 # same as the pre-commit hook
          GITLEAKS_CONFIG: .gitleaks.toml

  pins:
    # Every image is pinned by digest and nothing uses `latest`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          bad=$(grep -nE '^\s*image:' compose.yaml | grep -v '@sha256:' | grep -v 'media-stack/' || true)
          bad="$bad$(grep -nE '^FROM ' gateway/Dockerfile test/seeder/Dockerfile monitoring/*/Dockerfile | grep -v '@sha256:' || true)"
          bad="$bad$(grep -nE ':latest\b' compose.yaml monitoring/compose.yaml gateway/Dockerfile || true)"
          if [ -n "$bad" ]; then echo "Unpinned images:"; echo "$bad"; exit 1; fi
      # No content links: no real magnet, no .torrent file, no tracker URL but the test seeder's.
      - run: |
          bad=$(git grep -nIiE 'magnet:\?xt=urn:bt(ih|mh):[0-9a-z]{20,}' || true)
          bad="$bad$(git ls-files | grep -iE '\.torrent$' || true)"
          bad="$bad$(git grep -nIiE '(udp|https?)://[^ "]*/announce' | grep -v 'http://seeder:9117/announce' || true)"
          if [ -n "$bad" ]; then echo "Content links:"; echo "$bad"; exit 1; fi

  monitoring:
    # The separate monitoring stack: each config is checked by the binary that reads it, inside the
    # image that ships it.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monitoring
    env:
      GRAFANA_ADMIN_PASSWORD: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose config -q
      - run: docker compose build
      - run: docker run --rm --entrypoint promtool monitoring/prometheus:local check config /etc/prometheus/prometheus.yml
      - run: docker run --rm -v "$PWD/prometheus:/p:ro" -w /p/tests --entrypoint promtool monitoring/prometheus:local test rules media-stack.test.yml
      - run: docker run --rm monitoring/alloy:local validate /etc/alloy/config.alloy
      # The routing with Telegram (dummy token, real zone database) and the fallback without it.
      - run: docker run --rm -e TELEGRAM_BOT_TOKEN=0:ci -e TELEGRAM_CHAT_ID=-1 -e ALERT_TIMEZONE=Europe/Warsaw -e GRAFANA_URL=http://192.0.2.10:3000 monitoring/alertmanager:local amtool check-config /tmp/alertmanager.yml
      - run: docker run --rm monitoring/alertmanager:local amtool check-config /tmp/alertmanager.yml
      - run: docker run --rm monitoring/loki:local -config.file=/etc/loki/config.yaml -config.expand-env=true -verify-config
      - run: python3 grafana/build_dashboards.py --check # the JSON matches its generator

  e2e:
    # Leak and perimeter test against the whole stack with the local test seeder.
    # Secrets are generated fresh for every run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh scripts/gen-env.sh
      - run: docker compose --profile test --profile flaresolverr up -d --build
      - run: python3 test/leak/leak_test.py
      # FlareSolverr runs under our own entrypoint wrapper (compose.yaml): check that it starts and answers.
      - run: |
          for i in $(seq 1 30); do
            docker compose --profile test --profile flaresolverr exec -T seeder python3 -c "import urllib.request; urllib.request.urlopen('http://flaresolverr:8191/health', timeout=5)" && exit 0
            sleep 2
          done
          exit 1
      # Restore drill: a profile made before the backup is back after the volumes are wiped.
      - run: |
          T=$(sed -n 's/^HOUSEHOLD_TOKEN=//p' .env)
          curl -sf -X POST -H 'Content-Type: application/json' -d '{"action":"add","name":"Drill"}' "http://localhost:8080/h/$T/profiles" >/dev/null
          sh scripts/backup.sh /tmp/drill
          docker compose --profile test --profile flaresolverr down -v
          sh scripts/restore.sh /tmp/drill/media-stack-backup-*.tar
          docker compose --profile test --profile flaresolverr up -d
          for i in $(seq 1 60); do curl -sf http://localhost:8080/healthz >/dev/null && break; sleep 2; done
          curl -sf "http://localhost:8080/h/$T/profiles" | grep -q '"Drill"'
      - if: failure()
        run: |
          docker compose --profile test --profile flaresolverr ps -a
          docker compose --profile test --profile flaresolverr logs --tail 60
