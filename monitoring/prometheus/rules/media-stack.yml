# media-stack alerts. The gateway is scraped by its labels: job="gateway", project="media-stack".
# Without media-stack these series do not exist and the rules stay silent.
groups:
  - name: media-stack
    rules:
      # The zero-upload requirement: any piece data sent to a peer breaks it.
      - alert: TorrentUploadDetected
        expr: increase(gateway_torrent_upload_bytes_total[2m]) > 0
        labels: { severity: critical }
        annotations:
          summary: "TorrServer uploaded {{ $value | humanize1024 }}B of piece data to peers in 2 minutes"
      # Without the VPN, TorrServer or Prowlarr nothing plays; Lampac only adds the online sources.
      - alert: UpstreamDown
        expr: gateway_upstream_up{service!="lampac"} == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.service }} has not answered the gateway's probe for 5 minutes"
      - alert: UpstreamDown
        expr: gateway_upstream_up{service="lampac"} == 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }} has not answered the gateway's probe for 5 minutes"
      - alert: TorrServerSettingsDrift
        expr: gateway_torrserver_settings_drift > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "TorrServer's settings differ from the enforced ones"
      - alert: SearchErrorRatioHigh
        expr: |
          sum(rate(gateway_search_errors_total[15m]))
            / sum(rate(gateway_search_duration_seconds_count[15m])) > 0.20
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $value | humanizePercentage }} of searches failed over 15 minutes"
      - alert: SearchSlow
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(gateway_search_duration_seconds_bucket[30m]))) > 5
          and sum(increase(gateway_search_duration_seconds_count[30m])) >= 10
        labels: { severity: info }
        annotations:
          summary: "Search p95 is {{ $value | humanizeDuration }} over 30 minutes (SLO 5 s)"
